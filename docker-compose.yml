version: '3.9'
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app/src
    command: uvicorn photonflow.server.app:app --host 0.0.0.0 --port 8000
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://localhost:8000
    command: npm run dev -- --host 0.0.0.0 --port 5173
